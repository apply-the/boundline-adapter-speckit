[package]
name = "boundline-adapter-speckit"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
description = "Workflow bridge from Boundline into Spec Kit"
repository = "https://github.com/apply-the/boundline-adapter-speckit"
homepage = "https://github.com/apply-the/boundline-adapter-speckit"
readme = "README.md"

[dependencies]
boundline-protocol = "=0.90.0"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package.metadata.boundline-framework-adapter]
adapter_id = "speckit"
protocol_line = "framework-adapter-v1"
supported_boundline_range = ">=0.90.0,<1.0.0"
transport = "stdio-json-stdin-stdout"
stderr_policy = "trace_only"
lifecycle = "one_shot_no_graceful_shutdown"
