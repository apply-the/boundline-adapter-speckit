name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MSRV_TOOLCHAIN: 1.96.0

jobs:

  distribution-metadata:
    name: distribution-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/sync-distribution-metadata.sh
      - run: scripts/sync-distribution-metadata.sh
      - run: git diff --exit-code -- distribution/homebrew/Formula/boundline-adapter-speckit.rb

  test:
    name: test (MSRV 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.MSRV_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: ./scripts/test.sh

  current-stable:
    name: check (current stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
